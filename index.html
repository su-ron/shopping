<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易购商城 - 您的购物首选</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">易购商城</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#products">商品</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#deals">特价</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contact">联系我们</a>
                    </li>
                </ul>

                <!-- 搜索框 -->
                <form class="d-flex me-3" id="searchForm" onsubmit="handleSearch(event)">
                    <div class="input-group">
                        <input type="text" class="form-control" id="searchInput" placeholder="搜索蓝牙耳机..." aria-label="搜索">
                        <button class="btn btn-outline-light" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>
                <div id="searchSuggestions" class="position-absolute bg-white shadow rounded mt-1" style="display: none; z-index: 1000; width: 300px;"></div>
                <div class="navbar-nav">
                    <button class="btn btn-outline-light me-2" onclick="showLogin()">登录</button>
                    <button class="btn btn-warning position-relative" onclick="showCart()">
                        <i class="bi bi-cart"></i> 购物车
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartCount">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 轮播图 -->
    <div id="homeCarousel" class="carousel slide mb-4" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#homeCarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#homeCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#homeCarousel" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <div class="bg-primary text-white text-center py-5">
                    <h1>春季大促销</h1>
                    <p>全场商品 低至5折</p>
                    <button class="btn btn-light btn-lg">立即抢购</button>
                </div>
            </div>
            <div class="carousel-item">
                <div class="bg-success text-white text-center py-5">
                    <h2>新品上市</h2>
                    <p>最新潮流单品 现货供应</p>
                    <button class="btn btn-light btn-lg">查看新品</button>
                </div>
            </div>
            <div class="carousel-item">
                <div class="bg-warning text-dark text-center py-5">
                    <h2>会员专享</h2>
                    <p>注册即享95折优惠</p>
                    <button class="btn btn-dark btn-lg">立即注册</button>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#homeCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#homeCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <!-- 特色服务 -->
    <div class="container mb-5">
        <div class="row text-center">
            <div class="col-md-3 mb-4">
                <div class="feature-card">
                    <i class="bi bi-truck fs-1 text-primary"></i>
                    <h5>免费配送</h5>
                    <p>满99元免运费</p>
                </div>
            </div>
            <div class="col-md-3 mb-4">
                <div class="feature-card">
                    <i class="bi bi-shield-check fs-1 text-success"></i>
                    <h5>正品保证</h5>
                    <p>100%正品保障</p>
                </div>
            </div>
            <div class="col-md-3 mb-4">
                <div class="feature-card">
                    <i class="bi bi-arrow-repeat fs-1 text-warning"></i>
                    <h5>7天无理由退换</h5>
                    <p>不满意就退换</p>
                </div>
            </div>
            <div class="col-md-3 mb-4">
                <div class="feature-card">
                    <i class="bi bi-telephone fs-1 text-danger"></i>
                    <h5>24/7客服</h5>
                    <p>全天候在线服务</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 商品展示区 -->
    <div class="container mb-5" id="products">
        <h2 class="text-center mb-4">热门商品</h2>
        <div class="row" id="productGrid">
            <!-- 商品卡片将通过 JavaScript 动态生成 -->
        </div>
    </div>

    <!-- 登录模态框 -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">用户登录</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">密码</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">记住我</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="login()">登录</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 购物车模态框 -->
    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">购物车</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="cartItems">
                        <!-- 购物车商品将通过 JavaScript 动态生成 -->
                    </div>
                    <div class="mt-3 text-end">
                        <h4>总计: ¥<span id="totalPrice">0</span></h4>
                    </div>
                </div>
                <div class="modal-footer justify-content-between">
                    <button type="button" class="btn btn-danger" onclick="clearCart()">清空购物车</button>
                    <div>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">继续购物</button>
                        <button type="button" class="btn btn-success">去结算</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <h5>关于我们</h5>
                    <p>易购商城 - 您值得信赖的购物平台</p>
                </div>
                <div class="col-md-4">
                    <h5>客服中心</h5>
                    <p>电话: 400-123-4567<br>邮箱: service@ego.com</p>
                </div>
                <div class="col-md-4">
                    <h5>关注我们</h5>
                    <div class="d-flex justify-content-center gap-3">
                        <span class="fs-4">📱</span>
                        <span class="fs-4">💬</span>
                        <span class="fs-4">📧</span>
                    </div>
                </div>
            </div>
            <hr class="my-4">
            <p>&copy; 2024 易购商城. 保留所有权利.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
