<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情 - 蓝牙耳机专卖店</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .order-detail-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .order-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .order-header h1 {
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .order-status {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            margin: 10px 0;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .status-paid {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-processing {
            background: #cce5ff;
            color: #004085;
            border: 1px solid #b8daff;
        }

        .status-shipped {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .status-delivered {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .order-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #007bff;
        }

        .info-card h4 {
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 16px;
        }

        .info-item {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .info-label {
            color: #666;
            font-weight: 500;
        }

        .info-value {
            color: #333;
            font-weight: 600;
        }

        .order-items {
            margin-bottom: 30px;
        }

        .order-items h3 {
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .item-card {
            display: flex;
            align-items: center;
            padding: 20px;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            margin-bottom: 15px;
            background: white;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .item-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .item-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 20px;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 18px;
        }

        .item-spec {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .item-price {
            color: #e74c3c;
            font-weight: 600;
            font-size: 18px;
        }

        .item-quantity {
            color: #666;
            font-size: 14px;
        }

        .item-subtotal {
            font-weight: 600;
            color: #333;
            font-size: 18px;
        }

        .order-summary {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e9ecef;
        }

        .summary-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .summary-label {
            color: #666;
            font-weight: 500;
        }

        .summary-value {
            color: #333;
            font-weight: 600;
        }

        .total-amount {
            font-size: 24px;
            color: #e74c3c;
            font-weight: 700;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-action {
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-action i {
            font-size: 18px;
        }

        .timeline {
            margin: 30px 0;
            position: relative;
            padding-left: 30px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #007bff;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 25px;
            padding-left: 30px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -15px;
            top: 5px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #007bff;
            border: 3px solid white;
            box-shadow: 0 0 0 3px #007bff;
        }

        .timeline-item.completed::before {
            background: #28a745;
            box-shadow: 0 0 0 3px #28a745;
        }

        .timeline-item.current::before {
            background: #ffc107;
            box-shadow: 0 0 0 3px #ffc107;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 193, 7, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 193, 7, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 193, 7, 0); }
        }

        .timeline-content {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .timeline-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .timeline-time {
            color: #666;
            font-size: 14px;
        }

        .timeline-description {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .payment-info {
            background: #e8f4fd;
            border-left: 4px solid #007bff;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .payment-info h4 {
            color: #007bff;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .payment-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .payment-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #d1ecf1;
        }

        .payment-item:last-child {
            border-bottom: none;
        }

        .payment-label {
            color: #666;
            font-weight: 500;
        }

        .payment-value {
            color: #333;
            font-weight: 600;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .order-detail-container {
                margin: 20px;
                padding: 20px;
            }

            .order-info {
                grid-template-columns: 1fr;
            }

            .item-card {
                flex-direction: column;
                text-align: center;
            }

            .item-image {
                margin-right: 0;
                margin-bottom: 15px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn-action {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-earbuds"></i> 蓝牙耳机专卖店
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">
                    <i class="bi bi-house"></i> 返回首页
                </a>
                <a class="nav-link" href="#" onclick="viewOrders()">
                    <i class="bi bi-list-ul"></i> 我的订单
                </a>
            </div>
        </div>
    </nav>

    <!-- 订单详情容器 -->
    <div class="order-detail-container">
        <!-- 订单头部 -->
        <div class="order-header">
            <h1><i class="bi bi-receipt"></i> 订单详情</h1>
            <div class="order-number" id="orderNumber">订单号: 加载中...</div>
            <div class="order-status" id="orderStatus">加载中...</div>
            <div class="order-time" id="orderTime">创建时间: 加载中...</div>
        </div>

        <!-- 状态消息 -->
        <div class="status-message" id="statusMessage" style="display: none;"></div>

        <!-- 订单时间线 -->
        <div class="timeline" id="orderTimeline">
            <!-- 时间线将通过JavaScript动态生成 -->
        </div>

        <!-- 订单信息 -->
        <div class="order-info">
            <div class="info-card">
                <h4><i class="bi bi-person"></i> 收货信息</h4>
                <div class="info-item">
                    <span class="info-label">收货人:</span>
                    <span class="info-value" id="customerName">加载中...</span>
                </div>
                <div class="info-item">
                    <span class="info-label">联系电话:</span>
                    <span class="info-value" id="customerPhone">加载中...</span>
                </div>
                <div class="info-item">
                    <span class="info-label">收货地址:</span>
                    <span class="info-value" id="shippingAddress">加载中...</span>
                </div>
            </div>

            <div class="info-card">
                <h4><i class="bi bi-credit-card"></i> 支付信息</h4>
                <div class="info-item">
                    <span class="info-label">支付方式:</span>
                    <span class="info-value" id="paymentMethod">加载中...</span>
                </div>
                <div class="info-item">
                    <span class="info-label">支付状态:</span>
                    <span class="info-value" id="paymentStatus">加载中...</span>
                </div>
                <div class="info-item">
                    <span class="info-label">支付时间:</span>
                    <span class="info-value" id="paymentTime">加载中...</span>
                </div>
            </div>

            <div class="info-card">
                <h4><i class="bi bi-truck"></i> 物流信息</h4>
                <div class="info-item">
                    <span class="info-label">物流公司:</span>
                    <span class="info-value" id="shippingCompany">待发货</span>
                </div>
                <div class="info-item">
                    <span class="info-label">运单号:</span>
                    <span class="info-value" id="trackingNumber">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">发货时间:</span>
                    <span class="info-value" id="shippedTime">待发货</span>
                </div>
            </div>
        </div>

        <!-- 支付信息（如果已支付） -->
        <div class="payment-info" id="paymentDetails" style="display: none;">
            <h4><i class="bi bi-credit-card-2-front"></i> 支付详情</h4>
            <div class="payment-details" id="paymentDetailsContent">
                <!-- 支付详情将通过JavaScript动态生成 -->
            </div>
        </div>

        <!-- 订单商品 -->
        <div class="order-items">
            <h3><i class="bi bi-box-seam"></i> 订单商品</h3>
            <div id="orderItems">
                <!-- 商品将通过JavaScript动态加载 -->
            </div>
        </div>

        <!-- 订单汇总 -->
        <div class="order-summary">
            <h4><i class="bi bi-calculator"></i> 订单汇总</h4>
            <div class="summary-row">
                <span class="summary-label">商品总价:</span>
                <span class="summary-value" id="subtotal">¥0.00</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">运费:</span>
                <span class="summary-value" id="shippingFee">¥0.00</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">税费:</span>
                <span class="summary-value" id="taxFee">¥0.00</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">优惠:</span>
                <span class="summary-value" id="discount">¥0.00</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">实付金额:</span>
                <span class="summary-value total-amount" id="totalAmount">¥0.00</span>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="action-buttons" id="actionButtons">
            <!-- 按钮将通过JavaScript根据订单状态动态生成 -->
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 订单详情JavaScript -->
    <script>
        // 全局变量
        let currentOrderId = null;
        let token = localStorage.getItem('token');
        let orderData = null;

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 从URL获取订单ID
            const urlParams = new URLSearchParams(window.location.search);
            currentOrderId = urlParams.get('order_id');

            if (!currentOrderId) {
                showError('未找到订单信息');
                return;
            }

            // 检查用户是否登录
            if (!token) {
                showError('请先登录');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                return;
            }

            // 加载订单信息
            loadOrderDetail();
        });

        // 加载订单详情
        async function loadOrderDetail() {
            showLoading('正在加载订单详情...');

            try {
                const response = await fetch(`/api/orders/${currentOrderId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('获取订单详情失败');
                }

                const result = await response.json();

                if (result.success) {
                    orderData = result.data.order;
                    displayOrderDetail(orderData);
                    hideStatusMessage();
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                showError(`加载订单详情失败: ${error.message}`);
            }
        }

        // 显示订单详情
        function displayOrderDetail(order) {
            // 更新订单基本信息
            document.getElementById('orderNumber').textContent = `订单号: ${order.order_number}`;
            document.getElementById('orderTime').textContent = `创建时间: ${formatDate(order.created_at)}`;

            // 更新订单状态
            updateOrderStatus(order.status, order.payment_status);

            // 更新收货信息
            document.getElementById('customerName').textContent = order.customer_name;
            document.getElementById('customerPhone').textContent = order.customer_phone;
            document.getElementById('shippingAddress').textContent = order.shipping_address;

            // 更新支付信息
            document.getElementById('paymentMethod').textContent = order.payment_method || '未选择';
            document.getElementById('paymentStatus').textContent = getPaymentStatusText(order.payment_status);
            document.getElementById('paymentTime').textContent = order.paid_at ? formatDate(order.paid_at) : '-';

            // 更新订单汇总
            document.getElementById('subtotal').textContent = `¥${order.subtotal}`;
            document.getElementById('shippingFee').textContent = `¥${order.shipping_amount}`;
            document.getElementById('taxFee').textContent = `¥${order.tax_amount}`;
            document.getElementById('discount').textContent = `¥${order.discount_amount}`;
            document.getElementById('totalAmount').textContent = `¥${order.total_amount}`;

            // 显示订单商品
            displayOrderItems(order.items);

            // 显示时间线
            displayOrderTimeline(order);

            // 显示支付详情（如果已支付）
            if (order.payment && order.payment.status === 'success') {
                displayPaymentDetails(order.payment);
            }

            // 显示操作按钮
            displayActionButtons(order);
        }

        // 更新订单状态显示
        function updateOrderStatus(status, paymentStatus) {
            const statusEl = document.getElementById('orderStatus');
            const statusMap = {
                'pending': { text: '待支付', class: 'status-pending' },
                'processing': { text: '处理中', class: 'status-processing' },
                'shipped': { text: '已发货', class: 'status-shipped' },
                'delivered': { text: '已送达', class: 'status-delivered' },
                'cancelled': { text: '已取消', class: 'status-cancelled' },
                'refunded': { text: '已退款', class: 'status-cancelled' }
            };

            let statusText = statusMap[status]?.text || '未知状态';
            let statusClass = statusMap[status]?.class || 'status-pending';

            // 如果订单状态是pending但支付状态是paid，显示"待处理"
            if (status === 'pending' && paymentStatus === 'paid') {
                statusText = '待处理';
                statusClass = 'status-processing';
            }

            statusEl.textContent = statusText;
            statusEl.className = `order-status ${statusClass}`;
        }

        // 获取支付状态文本
        function getPaymentStatusText(paymentStatus) {
            const statusMap = {
                'pending': '待支付',
                'paid': '已支付',
                'failed': '支付失败',
                'refunded': '已退款'
            };
            return statusMap[paymentStatus] || '未知状态';
        }

        // 显示订单商品
        function displayOrderItems(items) {
            const container = document.getElementById('orderItems');
            container.innerHTML = '';

            if (items && items.length > 0) {
                items.forEach(item => {
                    const itemElement = document.createElement('div');
                    itemElement.className = 'item-card';
                    itemElement.innerHTML = `
                        <img src="https://images.unsplash.com/photo-1590658165737-15a047b8b5e7"
                             alt="${item.product_name}"
                             class="item-image">
                        <div class="item-details">
                            <div class="item-name">${item.product_name}</div>
                            <div class="item-spec">标准版</div>
                            <div class="item-price">¥${item.product_price}</div>
                            <div class="item-quantity">数量: ${item.quantity}</div>
                        </div>
                        <div class="item-subtotal">¥${item.subtotal}</div>
                    `;
                    container.appendChild(itemElement);
                });
            } else {
                container.innerHTML = '<p class="text-center text-muted">暂无商品信息</p>';
            }
        }

        // 显示订单时间线
        function displayOrderTimeline(order) {
            const timelineEl = document.getElementById('orderTimeline');
            const timelineItems = [];

            // 订单创建
            timelineItems.push({
                title: '订单创建',
                time: order.created_at,
                description: '订单已成功创建',
                completed: true,
                current: false
            });

            // 支付完成
            if (order.payment_status === 'paid' && order.paid_at) {
                timelineItems.push({
                    title: '支付完成',
                    time: order.paid_at,
                    description: `已通过${order.payment_method}完成支付`,
                    completed: true,
                    current: false
                });
            } else if (order.status === 'pending') {
                timelineItems.push({
                    title: '等待支付',
                    time: null,
                    description: '请尽快完成支付',
                    completed: false,
                    current: true
                });
            }

            // 订单处理
            if (order.status === 'processing' || order.status === 'shipped' || order.status === 'delivered') {
                timelineItems.push({
                    title: '订单处理',
                    time: order.updated_at,
                    description: '商家正在处理您的订单',
                    completed: true,
                    current: false
                });
            }

            // 发货
            if (order.status === 'shipped' && order.shipped_at) {
                timelineItems.push({
                    title: '已发货',
                    time: order.shipped_at,
                    description: '商品已发出，正在运输中',
                    completed: true,
                    current: false
                });
            } else if (order.status === 'processing') {
                timelineItems.push({
                    title: '等待发货',
                    time: null,
                    description: '商家正在准备发货',
                    completed: false,
                    current: true
                });
            }

            // 送达
            if (order.status === 'delivered' && order.delivered_at) {
                timelineItems.push({
                    title: '已送达',
                    time: order.delivered_at,
                    description: '商品已送达，请确认收货',
                    completed: true,
                    current: false
                });
            } else if (order.status === 'shipped') {
                timelineItems.push({
                    title: '运输中',
                    time: null,
                    description: '商品正在运输途中',
                    completed: false,
                    current: true
                });
            }

            // 生成时间线HTML
            let timelineHTML = '';
            timelineItems.forEach((item, index) => {
                const itemClass = item.completed ? 'completed' : (item.current ? 'current' : '');
                const timeText = item.time ? formatDate(item.time) : '进行中';

                timelineHTML += `
                    <div class="timeline-item ${itemClass}">
                        <div class="timeline-content">
                            <div class="timeline-title">${item.title}</div>
                            <div class="timeline-time">${timeText}</div>
                            <div class="timeline-description">${item.description}</div>
                        </div>
                    </div>
                `;
            });

            timelineEl.innerHTML = timelineHTML;
        }

        // 显示支付详情
        function displayPaymentDetails(payment) {
            const container = document.getElementById('paymentDetails');
            const content = document.getElementById('paymentDetailsContent');

            content.innerHTML = `
                <div class="payment-item">
                    <span class="payment-label">支付单号:</span>
                    <span class="payment-value">${payment.transaction_id}</span>
                </div>
                <div class="payment-item">
                    <span class="payment-label">支付方式:</span>
                    <span class="payment-value">${payment.payment_method === 'alipay' ? '支付宝' : '微信支付'}</span>
                </div>
                <div class="payment-item">
                    <span class="payment-label">支付金额:</span>
                    <span class="payment-value">¥${payment.amount}</span>
                </div>
                <div class="payment-item">
                    <span class="payment-label">支付状态:</span>
                    <span class="payment-value">${payment.status === 'success' ? '支付成功' : payment.status}</span>
                </div>
                <div class="payment-item">
                    <span class="payment-label">支付时间:</span>
                    <span class="payment-value">${formatDate(payment.paid_at)}</span>
                </div>
            `;

            container.style.display = 'block';
        }

        // 显示操作按钮
        function displayActionButtons(order) {
            const container = document.getElementById('actionButtons');
            let buttonsHTML = '';

            // 根据订单状态显示不同的按钮
            switch (order.status) {
                case 'pending':
                    if (order.payment_status === 'pending') {
                        buttonsHTML = `
                            <button class="btn btn-primary btn-action" onclick="goToPayment()">
                                <i class="bi bi-credit-card"></i> 立即支付
                            </button>
                            <button class="btn btn-outline-danger btn-action" onclick="cancelOrder()">
                                <i class="bi bi-x-circle"></i> 取消订单
                            </button>
                        `;
                    }
                    break;

                case 'processing':
                    buttonsHTML = `
                        <button class="btn btn-outline-primary btn-action" onclick="contactCustomerService()">
                            <i class="bi bi-headset"></i> 联系客服
                        </button>
                    `;
                    break;

                case 'shipped':
                    buttonsHTML = `
                        <button class="btn btn-success btn-action" onclick="confirmDelivery()">
                            <i class="bi bi-check-circle"></i> 确认收货
                        </button>
                        <button class="btn btn-outline-primary btn-action" onclick="viewTracking()">
                            <i class="bi bi-truck"></i> 查看物流
                        </button>
                    `;
                    break;

                case 'delivered':
                    buttonsHTML = `
                        <button class="btn btn-primary btn-action" onclick="requestRefund()">
                            <i class="bi bi-arrow-counterclockwise"></i> 申请退款
                        </button>
                        <button class="btn btn-outline-success btn-action" onclick="writeReview()">
                            <i class="bi bi-star"></i> 评价商品
                        </button>
                    `;
                    break;

                case 'cancelled':
                case 'refunded':
                    buttonsHTML = `
                        <button class="btn btn-outline-primary btn-action" onclick="reorder()">
                            <i class="bi bi-cart-plus"></i> 重新购买
                        </button>
                    `;
                    break;
            }

            // 总是显示返回按钮
            buttonsHTML += `
                <button class="btn btn-outline-secondary btn-action" onclick="viewOrders()">
                    <i class="bi bi-list-ul"></i> 返回订单列表
                </button>
            `;

            container.innerHTML = buttonsHTML;
        }

        // 跳转到支付页面
        function goToPayment() {
            window.location.href = `payment.html?order_id=${currentOrderId}`;
        }

        // 取消订单
        async function cancelOrder() {
            if (!confirm('确定要取消此订单吗？')) {
                return;
            }

            showLoading('正在取消订单...');

            try {
                const response = await fetch(`/api/orders/${currentOrderId}/cancel`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('取消订单失败');
                }

                const result = await response.json();

                if (result.success) {
                    showSuccess('订单已取消');
                    setTimeout(() => {
                        loadOrderDetail();
                    }, 2000);
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                showError(`取消订单失败: ${error.message}`);
            }
        }

        // 确认收货
        async function confirmDelivery() {
            if (!confirm('确定已收到商品吗？')) {
                return;
            }

            showLoading('正在确认收货...');

            try {
                const response = await fetch(`/api/orders/${currentOrderId}/confirm-delivery`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('确认收货失败');
                }

                const result = await response.json();

                if (result.success) {
                    showSuccess('已确认收货');
                    setTimeout(() => {
                        loadOrderDetail();
                    }, 2000);
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                showError(`确认收货失败: ${error.message}`);
            }
        }

        // 查看订单列表
        function viewOrders() {
            // 这里可以跳转到订单列表页面
            alert('订单列表功能正在开发中...');
        }

        // 联系客服
        function contactCustomerService() {
            alert('客服电话: 400-123-4567\n客服微信: earbuds_service');
        }

        // 查看物流
        function viewTracking() {
            alert('物流跟踪功能正在开发中...');
        }

        // 申请退款
        function requestRefund() {
            alert('退款申请功能正在开发中...');
        }

        // 评价商品
        function writeReview() {
            alert('商品评价功能正在开发中...');
        }

        // 重新购买
        function reorder() {
            alert('重新购买功能正在开发中...');
        }

        // 工具函数：格式化日期
        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleString('zh-CN');
        }

        // 显示加载状态
        function showLoading(message) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.className = 'status-message status-success';
            statusEl.innerHTML = `<i class="bi bi-hourglass-split"></i> ${message}`;
            statusEl.style.display = 'block';
        }

        // 显示成功消息
        function showSuccess(message) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.className = 'status-message status-success';
            statusEl.innerHTML = `<i class="bi bi-check-circle"></i> ${message}`;
            statusEl.style.display = 'block';
        }

        // 显示错误消息
        function showError(message) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.className = 'status-message status-error';
            statusEl.innerHTML = `<i class="bi bi-exclamation-circle"></i> ${message}`;
            statusEl.style.display = 'block';
        }

        // 隐藏状态消息
        function hideStatusMessage() {
            document.getElementById('statusMessage').style.display = 'none';
        }
    </script>
</body>
