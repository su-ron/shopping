<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付页面 - 蓝牙耳机专卖店</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .payment-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .payment-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .payment-header h1 {
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .payment-header .order-number {
            color: #666;
            font-size: 16px;
        }

        .payment-methods {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }

        .payment-method {
            width: 180px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .payment-method:hover {
            border-color: #007bff;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,123,255,0.1);
        }

        .payment-method.active {
            border-color: #007bff;
            background-color: rgba(0,123,255,0.05);
        }

        .payment-method i {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .payment-method.alipay i {
            color: #00a0e9;
        }

        .payment-method.wechat i {
            color: #07c160;
        }

        .payment-method h3 {
            font-size: 18px;
            margin-bottom: 5px;
            color: #333;
        }

        .payment-method p {
            color: #666;
            font-size: 14px;
        }

        .qr-code-section {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .qr-code-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .qr-code-container {
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        .qr-code-img {
            width: 250px;
            height: 250px;
            margin-bottom: 15px;
        }

        .payment-info {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .payment-info h4 {
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e9ecef;
        }

        .info-label {
            color: #666;
            font-weight: 500;
        }

        .info-value {
            color: #333;
            font-weight: 600;
        }

        .amount {
            font-size: 28px;
            color: #e74c3c;
            font-weight: 700;
        }

        .timer {
            font-size: 18px;
            color: #e74c3c;
            font-weight: 600;
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: #fff5f5;
            border-radius: 8px;
            border: 1px solid #ffcccc;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .btn-refresh {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-refresh:hover {
            background: #5a6268;
        }

        .btn-back {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-back:hover {
            background: #5a6268;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top-color: #007bff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .order-items {
            margin-top: 20px;
        }

        .order-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .item-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 20px;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .item-price {
            color: #e74c3c;
            font-weight: 600;
        }

        .item-quantity {
            color: #666;
        }

        .payment-instructions {
            background: #e8f4fd;
            border-left: 4px solid #007bff;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
        }

        .payment-instructions h5 {
            color: #007bff;
            margin-bottom: 10px;
        }

        .payment-instructions ul {
            margin: 0;
            padding-left: 20px;
        }

        .payment-instructions li {
            margin-bottom: 8px;
            color: #333;
        }

        @media (max-width: 768px) {
            .payment-container {
                margin: 20px;
                padding: 20px;
            }

            .payment-methods {
                flex-direction: column;
                align-items: center;
            }

            .payment-method {
                width: 100%;
                max-width: 300px;
            }

            .qr-code-img {
                width: 200px;
                height: 200px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-earbuds"></i> 蓝牙耳机专卖店
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">
                    <i class="bi bi-house"></i> 返回首页
                </a>
            </div>
        </div>
    </nav>

    <!-- 支付容器 -->
    <div class="payment-container">
        <div class="payment-header">
            <h1><i class="bi bi-credit-card"></i> 订单支付</h1>
            <div class="order-number" id="orderNumber">订单号: 加载中...</div>
            <div class="timer" id="paymentTimer">
                <i class="bi bi-clock"></i> 支付剩余时间: <span id="timeRemaining">30:00</span>
            </div>
        </div>

        <!-- 状态消息 -->
        <div class="status-message" id="statusMessage"></div>

        <!-- 订单信息 -->
        <div class="payment-info">
            <h4><i class="bi bi-receipt"></i> 订单信息</h4>
            <div class="info-row">
                <span class="info-label">订单金额:</span>
                <span class="info-value amount" id="orderAmount">¥0.00</span>
            </div>
            <div class="info-row">
                <span class="info-label">收货人:</span>
                <span class="info-value" id="customerName">加载中...</span>
            </div>
            <div class="info-row">
                <span class="info-label">联系电话:</span>
                <span class="info-value" id="customerPhone">加载中...</span>
            </div>
            <div class="info-row">
                <span class="info-label">收货地址:</span>
                <span class="info-value" id="shippingAddress">加载中...</span>
            </div>

            <!-- 订单商品 -->
            <div class="order-items" id="orderItems">
                <!-- 商品将通过JavaScript动态加载 -->
            </div>
        </div>

        <!-- 支付方式选择 -->
        <div class="payment-methods">
            <div class="payment-method alipay" data-method="alipay" onclick="selectPaymentMethod('alipay')">
                <i class="bi bi-wallet2"></i>
                <h3>支付宝支付</h3>
                <p>扫码支付，安全快捷</p>
            </div>
            <div class="payment-method wechat" data-method="wechat" onclick="selectPaymentMethod('wechat')">
                <i class="bi bi-wechat"></i>
                <h3>微信支付</h3>
                <p>扫码支付，方便快捷</p>
            </div>
        </div>

        <!-- 支付说明 -->
        <div class="payment-instructions">
            <h5><i class="bi bi-info-circle"></i> 支付说明</h5>
            <ul>
                <li>请选择支付方式后，使用对应的手机App扫描二维码完成支付</li>
                <li>支付成功后，页面将自动跳转到订单详情页</li>
                <li>支付有效时间为30分钟，超时订单将自动取消</li>
                <li>如遇支付问题，请刷新二维码或联系客服</li>
            </ul>
        </div>

        <!-- 二维码区域 -->
        <div class="qr-code-section" id="qrCodeSection">
            <h4 id="qrCodeTitle">支付宝扫码支付</h4>
            <div class="qr-code-container">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=请选择支付方式"
                     alt="支付二维码"
                     class="qr-code-img"
                     id="qrCodeImage">
                <div class="payment-no" id="paymentNo">支付单号: 请选择支付方式</div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="refreshQrCode()">
                    <i class="bi bi-arrow-clockwise"></i> 刷新二维码
                </button>
                <button class="btn btn-secondary" onclick="checkPaymentStatus()">
                    <i class="bi bi-check-circle"></i> 检查支付状态
                </button>
                <button class="btn btn-outline-secondary" onclick="window.location.href='index.html'">
                    <i class="bi bi-house"></i> 返回首页
                </button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 支付页面JavaScript -->
    <script>
        // 全局变量
        let currentOrderId = null;
        let currentPaymentId = null;
        let currentPaymentMethod = null;
        let paymentTimer = null;
        let timeRemaining = 30 * 60; // 30分钟，单位：秒
        let statusCheckInterval = null;
        let token = localStorage.getItem('token');
        let orderData = null;

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 从URL获取订单ID
            const urlParams = new URLSearchParams(window.location.search);
            currentOrderId = urlParams.get('order_id');

            if (!currentOrderId) {
                showError('未找到订单信息');
                return;
            }

            // 检查用户是否登录
            if (!token) {
                showError('请先登录');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                return;
            }

            // 加载订单信息
            loadOrderInfo();

            // 启动支付倒计时
            startPaymentTimer();
        });

        // 加载订单信息
        async function loadOrderInfo() {
            showLoading('正在加载订单信息...');

            try {
                const response = await fetch(`/api/orders/${currentOrderId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('获取订单信息失败');
                }

                const result = await response.json();

                if (result.success) {
                    orderData = result.data.order;
                    displayOrderInfo(orderData);
                    hideStatusMessage();
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                showError(`加载订单信息失败: ${error.message}`);
            }
        }

        // 显示订单信息
        function displayOrderInfo(order) {
            // 更新订单信息
            document.getElementById('orderNumber').textContent = `订单号: ${order.order_number}`;
            document.getElementById('orderAmount').textContent = `¥${order.total_amount}`;
            document.getElementById('customerName').textContent = order.customer_name;
            document.getElementById('customerPhone').textContent = order.customer_phone;
            document.getElementById('shippingAddress').textContent = order.shipping_address;

            // 显示订单商品
            const orderItemsContainer = document.getElementById('orderItems');
            if (order.items && order.items.length > 0) {
                order.items.forEach(item => {
                    const itemElement = document.createElement('div');
                    itemElement.className = 'order-item';
                    itemElement.innerHTML = `
                        <img src="https://images.unsplash.com/photo-1590658165737-15a047b8b5e7"
                             alt="${item.product_name}"
                             class="item-image">
                        <div class="item-details">
                            <div class="item-name">${item.product_name}</div>
                            <div class="item-price">¥${item.product_price}</div>
                            <div class="item-quantity">数量: ${item.quantity}</div>
                        </div>
                        <div class="item-subtotal">¥${item.subtotal}</div>
                    `;
                    orderItemsContainer.appendChild(itemElement);
                });
            }
        }

        // 选择支付方式
        function selectPaymentMethod(method) {
            // 移除所有支付方式的active类
            document.querySelectorAll('.payment-method').forEach(el => {
                el.classList.remove('active');
            });

            // 为选中的支付方式添加active类
            const selectedMethod = document.querySelector(`.payment-method[data-method="${method}"]`);
            selectedMethod.classList.add('active');

            currentPaymentMethod = method;

            // 更新二维码标题
            const title = method === 'alipay' ? '支付宝扫码支付' : '微信扫码支付';
            document.getElementById('qrCodeTitle').textContent = title;

            // 显示二维码区域
            document.getElementById('qrCodeSection').classList.add('active');

            // 创建支付并获取二维码
            createPaymentAndGetQrCode();
        }

        // 创建支付并获取二维码
        async function createPaymentAndGetQrCode() {
            showLoading('正在生成支付二维码...');

            try {
                // 创建支付记录
                const createResponse = await fetch('/api/payments/create', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        order_id: currentOrderId,
                        payment_method: currentPaymentMethod
                    })
                });

                if (!createResponse.ok) {
                    throw new Error('创建支付失败');
                }

                const createResult = await createResponse.json();

                if (createResult.success) {
                    currentPaymentId = createResult.data.payment.id;

                    // 获取二维码
                    await getQrCode();

                    // 开始轮询支付状态
                    startStatusPolling();

                    hideStatusMessage();
                } else {
                    throw new Error(createResult.message);
                }
            } catch (error) {
                showError(`创建支付失败: ${error.message}`);
            }
        }

        // 获取二维码
        async function getQrCode() {
            try {
                const response = await fetch(`/api/payments/${currentPaymentId}/qrcode`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('获取二维码失败');
                }

                const result = await response.json();

                if (result.success) {
                    const qrCodeData = result.data;

                    // 更新二维码图片
                    document.getElementById('qrCodeImage').src = qrCodeData.qr_code_url;
                    document.getElementById('paymentNo').textContent = `支付单号: ${qrCodeData.payment_no}`;

                    // 重置倒计时为30分钟
                    timeRemaining = 30 * 60;
                    updateTimerDisplay();
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                showError(`获取二维码失败: ${error.message}`);
            }
        }

        // 刷新二维码
        async function refreshQrCode() {
            showLoading('正在刷新二维码...');
            await getQrCode();
            hideStatusMessage();
        }

        // 检查支付状态
        async function checkPaymentStatus() {
            showLoading('正在检查支付状态...');

            try {
                const response = await fetch(`/api/payments/${currentPaymentId}/status`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('检查支付状态失败');
                }

                const result = await response.json();

                if (result.success) {
                    const status = result.data.status;

                    if (status === 'success') {
                        showSuccess('支付成功！正在跳转到订单详情...');
                        setTimeout(() => {
                            window.location.href = `order-detail.html?order_id=${currentOrderId}`;
                        }, 2000);
                    } else if (status === 'pending') {
                        showInfo('支付进行中，请继续完成支付');
                    } else {
                        showError(`支付状态: ${result.data.status_text}`);
                    }
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                showError(`检查支付状态失败: ${error.message}`);
            }
        }

        // 开始轮询支付状态
        function startStatusPolling() {
            // 清除之前的轮询
            if (statusCheckInterval) {
                clearInterval(statusCheckInterval);
            }

            // 每10秒检查一次支付状态
            statusCheckInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/payments/${currentPaymentId}/status`, {
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (response.ok) {
                        const result = await response.json();
                        if (result.success && result.data.status === 'success') {
                            // 支付成功
                            clearInterval(statusCheckInterval);
                            showSuccess('支付成功！正在跳转到订单详情...');
                            setTimeout(() => {
                                window.location.href = `order-detail.html?order_id=${currentOrderId}`;
                            }, 2000);
                        }
                    }
                } catch (error) {
                    console.error('轮询支付状态失败:', error);
                }
            }, 10000); // 10秒
        }

        // 启动支付倒计时
        function startPaymentTimer() {
            if (paymentTimer) {
                clearInterval(paymentTimer);
            }

            paymentTimer = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    clearInterval(paymentTimer);
                    showError('支付超时，订单已自动取消');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                }
            }, 1000);
        }

        // 更新倒计时显示
        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            document.getElementById('timeRemaining').textContent =
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // 最后5分钟显示红色警告
            if (timeRemaining <= 300) {
                document.getElementById('paymentTimer').style.color = '#e74c3c';
                document.getElementById('paymentTimer').style.backgroundColor = '#fff5f5';
                document.getElementById('paymentTimer').style.borderColor = '#ffcccc';
            }
        }

        // 显示加载状态
        function showLoading(message) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.className = 'status-message status-loading';
            statusEl.innerHTML = `<span class="loading-spinner"></span> ${message}`;
            statusEl.style.display = 'block';
        }

        // 显示成功消息
        function showSuccess(message) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.className = 'status-message status-success';
            statusEl.innerHTML = `<i class="bi bi-check-circle"></i> ${message}`;
            statusEl.style.display = 'block';
        }

        // 显示错误消息
        function showError(message) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.className = 'status-message status-error';
            statusEl.innerHTML = `<i class="bi bi-exclamation-circle"></i> ${message}`;
            statusEl.style.display = 'block';
        }

        // 显示信息消息
        function showInfo(message) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.className = 'status-message status-loading';
            statusEl.innerHTML = `<i class="bi bi-info-circle"></i> ${message}`;
            statusEl.style.display = 'block';
        }

        // 隐藏状态消息
        function hideStatusMessage() {
            document.getElementById('statusMessage').style.display = 'none';
        }

        // 模拟支付（仅开发环境使用）
        async function simulatePayment() {
            if (confirm('确定要模拟支付成功吗？（仅限开发测试）')) {
                try {
                    const response = await fetch('/api/payments/simulate', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            payment_id: currentPaymentId
                        })
                    });

                    if (response.ok) {
                        const result = await response.json();
                        if (result.success) {
                            showSuccess('模拟支付成功！');
                            setTimeout(() => {
                                window.location.href = `order-detail.html?order_id=${currentOrderId}`;
                            }, 2000);
                        }
                    }
                } catch (error) {
                    showError('模拟支付失败');
                }
            }
        }

        // 开发环境添加模拟支付按钮
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            const actionButtons = document.querySelector('.action-buttons');
            const simulateButton = document.createElement('button');
            simulateButton.className = 'btn btn-warning';
            simulateButton.innerHTML = '<i class="bi bi-play-circle"></i> 模拟支付';
            simulateButton.onclick = simulatePayment;
            actionButtons.appendChild(simulateButton);
        }
    </script>
</body>
</html>
